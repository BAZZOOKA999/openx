name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Create debug signing key
        run: keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
      - name: Compile and test
        run: gradle assembleDebug testDebugUnitTest --stacktrace
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk OpenX.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OpenX-apk
          path: OpenX.apk
      - name: Publish downloadable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apk-latest || gh release create apk-latest --title "OpenX - APK para Android" --notes "APK de teste para Android 7.0 ou superior. Baixe e instale OpenX.apk."
          gh release upload apk-latest OpenX.apk --clobber
